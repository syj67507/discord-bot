name: Code Checks

on:
  push:
    branches: [revamp2025]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Check for linting errors
        run: npm run lint

      - name: Run Unit Tests
        run: npm test -- run
